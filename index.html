<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Nuance">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Nuance</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.swipe-slide {
  flex: 0 0 100%;
  min-width: 0;
}

#swipeOuter,
.swipe-track {
  min-width: 0;
}

.main {
  overflow-x: hidden;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0a0a;
  --surface: #0f0f0f;
  --card: #141414;
  --border: #242424;
  --border-vis: #333;
  --text: #eeeeee;
  --text-muted: #777;
  --text-dim: #333;
  --active: #3DBA6F;
  --bottom-nav-h: 68px;
}

body {
  font-family: 'Outfit', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
}

body.light {
  --bg: #f5f0e8;
  --surface: #ede8dc;
  --card: #fdfaf5;
  --border: #d4cfc3;
  --border-vis: #c0bab0;
  --text: #1a1209;
  --text-muted: #7a7060;
  --text-dim: #c0bab0;
}

/* ── DESKTOP LAYOUT ── */
.layout {
  display: grid;
  grid-template-columns: 210px 1fr;
  min-height: 100vh;
}

.sidebar {
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 28px 0 24px;
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.brand { padding: 0 20px 22px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
.brand-name { font-size: 1.1rem; font-weight: 700; color: var(--text); }
.brand-sub { font-size: 0.65rem; color: var(--text-muted); margin-top: 3px; font-weight: 300; }
.nav-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 9px 20px; cursor: pointer; transition: all 0.12s;
  border-left: 2px solid transparent;
}
.nav-item:hover { background: rgba(255,255,255,0.03); }
body.light .nav-item:hover { background: rgba(0,0,0,0.03); }
.nav-item.active { border-left-color: var(--active); background: rgba(255,255,255,0.04); }
body.light .nav-item.active { background: rgba(0,0,0,0.04); }
.nav-text { font-size: 0.8rem; color: var(--text-muted); }
.nav-item.active .nav-text { color: var(--text); font-weight: 500; }
.nav-count { font-family: 'Space Mono', monospace; font-size: 0.55rem; color: var(--text-dim); }
.nav-divider { height: 1px; background: var(--border); margin: 10px 0; }
.sidebar-settings {
  padding: 14px 20px; border-top: 1px solid var(--border);
  margin-top: auto; display: flex; flex-direction: column; gap: 12px;
}
.setting-row { display: flex; align-items: center; justify-content: space-between; }
.setting-label { font-size: 0.72rem; color: var(--text-muted); }
.toggle {
  width: 36px; height: 20px; background: var(--border-vis);
  border-radius: 10px; position: relative; cursor: pointer;
  transition: background 0.2s; flex-shrink: 0;
}
.toggle.on { background: var(--active); }
.toggle::after {
  content: ''; position: absolute; width: 14px; height: 14px;
  background: #fff; border-radius: 50%; top: 3px; left: 3px; transition: transform 0.2s;
}
.toggle.on::after { transform: translateX(16px); }

/* ── MOBILE TOPBAR ── */
/* Hidden by default, shown via JS on mobile */
#mobileTopbar {
  display: none;
  position: sticky; top: 0; z-index: 50;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  width: 100%;
}
.mobile-brand { font-size: 1rem; font-weight: 700; color: var(--text); }
.mobile-controls { display: flex; flex-direction: row; align-items: center; gap: 8px; }
.mobile-btn {
  font-size: 0.64rem;
  font-family: 'Space Mono', monospace;
  color: var(--text-muted);
  background: var(--card);
  border: 1px solid var(--border-vis);
  border-radius: 4px;
  padding: 7px 10px;
  cursor: pointer;
  white-space: nowrap;
  min-height: 36px;
  min-width: 72px;
  text-align: center;
  -webkit-tap-highlight-color: transparent;
}

/* ── BOTTOM NAV ── */
#bottomNav {
  display: none;
  position: fixed; bottom: 0; left: 0; right: 0;
  height: var(--bottom-nav-h);
  background: var(--surface);
  border-top: 2px solid var(--border);
  z-index: 100;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
#bottomNav::-webkit-scrollbar { display: none; }
.bnav-inner { display: flex; height: 100%; min-width: max-content; }
.bnav-item {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 5px; padding: 0 16px; cursor: pointer; transition: all 0.12s;
  border-top: 3px solid transparent; flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
}
.bnav-item.active { border-top-color: var(--active); }
.bnav-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border-vis); }
.bnav-item.active .bnav-dot { background: var(--active); }
.bnav-label { font-size: 0.65rem; color: var(--text-muted); white-space: nowrap; }
.bnav-item.active .bnav-label { color: var(--text); font-weight: 600; }

/* ── MAIN ── */
.main { padding: 40px 52px 80px; max-width: 860px; }
.page-header {
  margin-bottom: 28px; padding-bottom: 14px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: flex-end; justify-content: space-between;
}
.page-cat {
  font-family: 'Space Mono', monospace; font-size: 0.55rem;
  letter-spacing: 0.22em; text-transform: uppercase; color: var(--active); margin-bottom: 4px;
}
.page-sub { font-size: 0.82rem; color: var(--text-muted); font-weight: 300; }
.progress-indicator { font-family: 'Space Mono', monospace; font-size: 0.65rem; color: var(--text-muted); }

/* ── SWIPE ── */
.swipe-outer { width: 100%; overflow: hidden; border-radius: 10px; }
.swipe-track { display: flex; will-change: transform; }
.swipe-slide { flex-shrink: 0; overflow: hidden; }

/* ── CARD ── */
.card {
  background: var(--card); border: 1px solid var(--border-vis);
  border-radius: 10px; overflow: hidden;
  box-shadow: 0 2px 20px rgba(0,0,0,0.5);
}
body.light .card { box-shadow: 0 1px 12px rgba(0,0,0,0.08); }
.card-top-bar { height: 4px; }
.card-body { padding: 28px 32px 24px; }
.section-label {
  font-family: 'Space Mono', monospace; font-size: 0.52rem;
  letter-spacing: 0.22em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px;
}
.hero-block { margin-bottom: 24px; }
.hero-sentence {
  font-size: 1.75rem; font-weight: 700; line-height: 1.35;
  color: var(--text); letter-spacing: -0.01em; margin-bottom: 14px;
}
.hero-sentence .hl { color: #000; padding: 1px 6px; border-radius: 2px; }
.btn-listen-sm {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 16px; border: 1px solid var(--border-vis);
  border-radius: 4px; background: transparent;
  font-family: 'Space Mono', monospace; font-size: 0.6rem;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--text-muted); cursor: pointer;
  min-height: 42px; -webkit-tap-highlight-color: transparent;
}
.btn-listen-sm.playing { border-color: var(--active); color: var(--active); }
.phrase-block {
  padding: 18px 0; border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border); margin-bottom: 20px;
}
.phrase-row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.phrase-text { font-size: 1.65rem; font-weight: 700; line-height: 1.15; }
.meaning-header { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 4px 0; }
.meaning-label {
  font-family: 'Space Mono', monospace; font-size: 0.52rem;
  letter-spacing: 0.22em; text-transform: uppercase; color: var(--text-muted);
}
.meaning-toggle-icon { font-size: 0.65rem; color: var(--text-muted); }
.meaning-body { margin-top: 10px; }
.meaning-text { font-size: 0.95rem; line-height: 1.6; color: var(--text); font-weight: 300; }
.example-item {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 12px; padding: 12px 0; border-top: 1px solid var(--border);
}
.example-left { display: flex; align-items: flex-start; gap: 8px; flex: 1; min-width: 0; }
.example-quote { font-size: 1.3rem; line-height: 1; margin-top: 2px; flex-shrink: 0; font-weight: 700; opacity: 0.3; }
.example-text { font-size: 0.95rem; font-weight: 400; line-height: 1.55; color: var(--text); }
.example-text .hl { font-weight: 600; }
.audio-bar {
  display: flex; align-items: center; gap: 10px;
  margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border); flex-wrap: wrap;
}
.btn-play-all {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 20px; border: none; border-radius: 4px;
  font-family: 'Space Mono', monospace; font-size: 0.62rem;
  font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
  color: #000; cursor: pointer; min-height: 44px; -webkit-tap-highlight-color: transparent;
}
.btn-stop {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 16px; background: transparent; color: var(--text-muted);
  border: 1px solid var(--border-vis); border-radius: 4px;
  font-family: 'Space Mono', monospace; font-size: 0.62rem;
  letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; min-height: 44px;
}
.now-playing {
  font-family: 'Space Mono', monospace; font-size: 0.56rem;
  color: var(--active); display: none; align-items: center; gap: 6px;
}
.now-playing.show { display: flex; }
.wave { display: flex; align-items: center; gap: 2px; height: 10px; }
.wave span { width: 2px; border-radius: 1px; animation: wv 0.7s ease-in-out infinite; }
.wave span:nth-child(1){height:3px;animation-delay:0s}
.wave span:nth-child(2){height:9px;animation-delay:0.1s}
.wave span:nth-child(3){height:6px;animation-delay:0.2s}
.wave span:nth-child(4){height:9px;animation-delay:0.15s}
.wave span:nth-child(5){height:3px;animation-delay:0.05s}
@keyframes wv{0%,100%{transform:scaleY(0.4)}50%{transform:scaleY(1)}}

/* LOCK */
.lock-card {
  background: var(--card); border: 1px solid var(--border-vis);
  border-radius: 10px; overflow: hidden; position: relative;
  box-shadow: 0 2px 20px rgba(0,0,0,0.5);
}
body.light .lock-card { box-shadow: 0 1px 12px rgba(0,0,0,0.08); }
.lock-card-inner { padding: 28px 32px; filter: blur(5px); pointer-events: none; user-select: none; opacity: 0.35; }
.lock-overlay {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 12px;
  background: rgba(10,10,10,0.8);
}
body.light .lock-overlay { background: rgba(245,240,232,0.8); }
.lock-icon { font-size: 2rem; }
.lock-title { font-size: 1rem; font-weight: 600; color: var(--text); }
.lock-sub { font-size: 0.78rem; color: var(--text-muted); text-align: center; padding: 0 20px; }
.btn-unlock {
  padding: 11px 22px; border: none; border-radius: 4px;
  font-family: 'Space Mono', monospace; font-size: 0.62rem;
  font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
  color: #000; cursor: pointer; min-height: 44px; margin-top: 4px;
}

/* NAV ROW */
.nav-row {
  display: flex; align-items: center; justify-content: space-between; margin-top: 20px;
}
.btn-nav {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 18px; background: transparent;
  border: 1px solid var(--border-vis); border-radius: 4px;
  font-family: 'Space Mono', monospace; font-size: 0.62rem;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--text-muted); cursor: pointer; min-height: 44px;
  -webkit-tap-highlight-color: transparent;
}
.btn-nav:active:not(:disabled) { border-color: var(--active); color: var(--active); }
.btn-nav:disabled { opacity: 0.2; cursor: not-allowed; }
.nav-dots { display: flex; gap: 7px; align-items: center; }
.dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--border-vis); cursor: pointer; transition: background 0.2s, transform 0.2s;
}
.dot.active { background: var(--active); transform: scale(1.3); }
.dot.locked { opacity: 0.35; cursor: default; }

.loading-state {
  padding: 60px 20px; color: var(--text-muted);
  font-family: 'Space Mono', monospace; font-size: 0.7rem; text-align: center;
}
.loading-dot { display: inline-block; animation: ldot 1s ease-in-out infinite; }
.loading-dot:nth-child(2){animation-delay:0.2s}
.loading-dot:nth-child(3){animation-delay:0.4s}
@keyframes ldot{0%,80%,100%{opacity:0.2}40%{opacity:1}}
</style>
</head>
<body>
<div class="layout">

  <!-- MOBILE TOPBAR (shown via JS) -->
  <div id="mobileTopbar">
    <div class="mobile-brand">Nuance</div>
    <div class="mobile-controls">
      <button class="mobile-btn" id="themeBtn">☀️ light</button>
      <button class="mobile-btn" id="autoBtn">⏸ auto</button>
    </div>
  </div>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-name">Nuance</div>
      <div class="brand-sub">learn english, naturally.</div>
    </div>
    <div class="nav-item active" id="nav-daily"><span class="nav-text">Daily Expressions</span><span class="nav-count" id="cnt-daily"></span></div>
    <div class="nav-item" id="nav-mistakes"><span class="nav-text">Common Mistakes</span><span class="nav-count" id="cnt-mistakes"></span></div>

    <div class="nav-item" id="nav-advanced"><span class="nav-text">Advanced Words</span><span class="nav-count" id="cnt-advanced"></span></div>
    <div class="nav-item" id="nav-idioms"><span class="nav-text">Idioms</span><span class="nav-count" id="cnt-idioms"></span></div>
    <div class="nav-divider"></div>
    <div class="nav-item" id="nav-shadowing"><span class="nav-text">Shadowing</span></div>
    <div class="nav-item" id="nav-favorites"><span class="nav-text">Favorites</span></div>
    <div class="nav-item" id="nav-progress"><span class="nav-text">Progress</span></div>
    <div class="sidebar-settings">
      <div class="setting-row"><span class="setting-label">Light mode</span><div class="toggle" id="themeToggle"></div></div>
      <div class="setting-row"><span class="setting-label">Auto-play</span><div class="toggle on" id="autoPlayToggle"></div></div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main" id="mainArea">
    <div class="page-header">
      <div>
        <div class="page-cat" id="pageCat">Daily Expressions</div>
        <div class="page-sub" id="pageSub">Natural expressions for real-life conversations.</div>
      </div>
      <div class="progress-indicator" id="progressIndicator"></div>
    </div>
    <div class="swipe-outer" id="swipeOuter">
      <div class="swipe-track" id="swipeTrack">
        <div class="loading-state">
          <span class="loading-dot">.</span><span class="loading-dot">.</span><span class="loading-dot">.</span>
        </div>
      </div>
    </div>
    <div class="nav-row" id="navRow" style="display:none">
      <button class="btn-nav" id="btnPrev">← prev</button>
      <div class="nav-dots" id="navDots"></div>
      <button class="btn-nav" id="btnNext">next →</button>
    </div>
  </main>
</div>

<!-- BOTTOM NAV (shown via JS) -->
<div id="bottomNav">
  <div class="bnav-inner">
    <div class="bnav-item active" id="bnav-daily"><div class="bnav-dot"></div><span class="bnav-label">Daily</span></div>
    <div class="bnav-item" id="bnav-mistakes"><div class="bnav-dot"></div><span class="bnav-label">Mistakes</span></div>
    <div class="bnav-item" id="bnav-phrasal"><div class="bnav-dot"></div><span class="bnav-label">Phrasal</span></div>
    <div class="bnav-item" id="bnav-advanced"><div class="bnav-dot"></div><span class="bnav-label">Advanced</span></div>
    <div class="bnav-item" id="bnav-idioms"><div class="bnav-dot"></div><span class="bnav-label">Idioms</span></div>
    <div class="bnav-item" id="bnav-shadowing"><div class="bnav-dot"></div><span class="bnav-label">Shadow</span></div>
    <div class="bnav-item" id="bnav-favorites"><div class="bnav-dot"></div><span class="bnav-label">Saved</span></div>
  </div>
</div>

<script>
const SUPABASE_URL='https://xlfgnhcltpqdtgmdjjwp.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhsZmduaGNsdHBxZHRnbWRqandwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4ODQ4ODMsImV4cCI6MjA5NDQ2MDg4M30.p8xggEvLrAAw5GuLsQu9XQLtreo715KJg1H6OEgKL2w';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const FREE_LIMIT=3;
const CATS={
  daily:    {title:'Daily Expressions',sub:'Natural expressions for real-life conversations.',color:'#3DBA6F',items:[]},
  mistakes: {title:'Common Mistakes',sub:'Fix the errors that give you away.',color:'#FF5C3A',items:[]},
  phrasal:  {title:'Phrasal Words',sub:'Master phrases native speakers use every day.',color:'#F5C518',items:[]},
  advanced: {title:'Advanced Words',sub:'Elevate your vocabulary with words native speakers actually use.',color:'#4A9EFF',items:[]},
  idioms:   {title:'Idioms',sub:'Expressions that mean more than the words themselves.',color:'#B47FFF',items:[]},
  shadowing:{title:'Shadowing',sub:'Coming soon.',color:'#aaa',items:[]},
  favorites:{title:'Favorites',sub:'Your saved phrases.',color:'#aaa',items:[]},
  progress: {title:'Progress',sub:'Your learning journey.',color:'#aaa',items:[]},
};

let current='daily',cardIndex=0,autoPlay=true,isPlaying=false;
const synth=window.speechSynthesis;
let isMobile=false;
let isAdmin = false;

// ── MOBILE DETECTION ──
function checkMobile(){
async function loadUserRole() {
  const { data: { user } } = await supabase.auth.getUser();
  if (!user) return;

  const { data, error } = await db
    .from('profiles')
    .select('role')
    .eq('id', user.id)
    .single();

  if (!error && data?.role === 'admin') {
    isAdmin = true;
  }
}
  isMobile=window.innerWidth<=768;
  const topbar=document.getElementById('mobileTopbar');
  const bnav=document.getElementById('bottomNav');
  const sidebar=document.getElementById('sidebar');
  const layout=document.querySelector('.layout');
  const main=document.getElementById('mainArea');

  if(isMobile){
    topbar.style.display='flex';
    bnav.style.display='block';
    sidebar.style.display='none';
    layout.style.gridTemplateColumns='1fr';
    main.style.padding='12px 12px calc(68px + 20px)';
    main.style.maxWidth='100%';

    requestAnimationFrame(() => {
  rebuildSlideWidths();
  
});
  } else {
    topbar.style.display='none';
    bnav.style.display='none';
    sidebar.style.display='flex';
    layout.style.gridTemplateColumns='210px 1fr';
    main.style.padding='40px 52px 80px';
    main.style.maxWidth='860px';
  }
}

checkMobile();
window.addEventListener('resize',()=>{ checkMobile(); rebuildSlideWidths(); });
setTimeout(() => {
  rebuildSlideWidths();
 
}, 50);
// ── TEXT HELPERS ──
function parseText(t,c){
  return t.replace(/\[([^\]]+)\]/g,`<span class="hl" style="background:${c};color:#000;padding:1px 6px;border-radius:2px">$1</span>`);
}
function plain(t){ return t.replace(/\[([^\]]+)\]/g,'$1'); }

// ── AUDIO ──
function stopAll(){
  synth.cancel(); isPlaying=false;
  document.querySelectorAll('.btn-play-all').forEach(b=>b.textContent='▶ play all');
  document.querySelectorAll('.now-playing').forEach(n=>n.classList.remove('show'));
  document.querySelectorAll('.btn-listen-sm').forEach(b=>b.classList.remove('playing'));
}

function speakOne(text,btn){
  synth.cancel();
  document.querySelectorAll('.btn-listen-sm').forEach(b=>b.classList.remove('playing'));
  document.querySelectorAll('.btn-play-all').forEach(b=>b.textContent='▶ play all');
  document.querySelectorAll('.now-playing').forEach(n=>n.classList.remove('show'));
  isPlaying=true;
  if(btn) btn.classList.add('playing');
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-GB'; u.rate=0.85;
  u.onend=u.onerror=()=>{isPlaying=false; if(btn) btn.classList.remove('playing');};
  synth.speak(u);
}

function playSequence(item){
  stopAll(); isPlaying=true;
  const playBtn=document.querySelector('.btn-play-all');
  const np=document.querySelector('.now-playing');
  const npSpan=np?.querySelector('span:last-child');
  if(playBtn) playBtn.textContent='▶ playing...';
  if(np) np.classList.add('show');
  const steps=[
    {text:plain(item.hero),label:'sentence'},
    {text:item.phrase,label:'phrase'},
    {text:item.meaning,label:'meaning'},
    ...item.examples.map((e,i)=>({text:plain(e),label:`example ${i+1}`})),
  ];
  let i=0;
  function next(){
    if(!isPlaying||i>=steps.length){stopAll();return;}
    if(npSpan) npSpan.textContent=steps[i].label;
    const u=new SpeechSynthesisUtterance(steps[i].text);
    u.lang='en-GB'; u.rate=0.85;
    u.onend=()=>{i++;setTimeout(next,600);};
    u.onerror=stopAll;
    synth.speak(u);
  }
  next();
}

// ── SWIPE WIDTH ──
function getW(){ return document.getElementById('swipeOuter').clientWidth||window.innerWidth; }

function rebuildSlideWidths(){
  const w = getW();
  const track = document.getElementById('swipeTrack');
  const slides = track.querySelectorAll('.swipe-slide');
  if(!slides.length) return;

  track.style.width = (w * slides.length) + 'px';
  slides.forEach(s => {
    s.style.width = w + 'px';
    s.style.minWidth = w + 'px';
    s.style.flex = '0 0 auto';
  });

  requestAnimationFrame(() => setTrackPos(false));
}
// ── BUILD TRACK ──
function buildTrack(){
  const cat=CATS[current];
  const track=document.getElementById('swipeTrack');
  track.innerHTML='';
  track.style.transition='none';
  track.style.transform='translateX(0px)';
  track.style.width='100%';

  if(!cat.items.length){
    track.innerHTML=`<div style="padding:60px 20px;color:var(--text-muted);font-size:0.9rem;text-align:center">Coming soon.</div>`;
    updateUI();
    return;
  }

  const w=getW();
  track.style.width=(w*cat.items.length)+'px';

  cat.items.forEach((item,idx)=>{
    const slide=document.createElement('div');
    slide.className='swipe-slide';
    slide.style.width=w+'px';
    slide.style.minWidth=w+'px';
    slide.style.flex='0 0 auto';
    const c=cat.color;
    const locked=!isAdmin && idx>=FREE_LIMIT;

    if(locked){
      slide.innerHTML=`
        <div class="lock-card">
          <div class="card-top-bar" style="background:${c}"></div>
          <div class="lock-card-inner">
            <div style="font-size:1.2rem;font-weight:700;line-height:1.4;margin-bottom:10px">${parseText(item.hero,c)}</div>
            <div style="font-size:1.2rem;font-weight:700;color:${c}">${item.phrase}</div>
            <div style="margin-top:8px;font-size:0.85rem;opacity:0.6">${item.meaning}</div>
          </div>
          <div class="lock-overlay">
            <div class="lock-icon">🔒</div>
            <div class="lock-title">Unlock Full Access</div>
            <div class="lock-sub">Get all ${cat.items.length} expressions in this pack</div>
            <button class="btn-unlock" style="background:${c}">Unlock Pack →</button>
          </div>
        </div>`;
    } else {
      slide.innerHTML=`
        <div class="card">
          <div class="card-top-bar" style="background:${c}"></div>
          <div class="card-body">
            <div class="hero-block">
              <div class="section-label">example</div>
              <div class="hero-sentence">${parseText(item.hero,c)}</div>
              <button class="btn-listen-sm" data-text="${plain(item.hero).replace(/"/g,'&quot;')}">▶ listen</button>
            </div>
            <div class="phrase-block">
              <div class="section-label">phrase</div>
              <div class="phrase-row">
                <div class="phrase-text" style="color:${c}">${item.phrase}</div>
                <button class="btn-listen-sm" data-text="${item.phrase.replace(/"/g,'&quot;')}">▶ listen</button>
              </div>
              <div class="meaning-header">
                <span class="meaning-label">meaning</span>
                <span class="meaning-toggle-icon">▾</span>
              </div>
              <div class="meaning-body"><div class="meaning-text">${item.meaning}</div></div>
            </div>
            <div class="examples-block">
              <div class="section-label">more examples</div>
              ${item.examples.map(ex=>`
                <div class="example-item">
                  <div class="example-left">
                    <div class="example-quote" style="color:${c}">"</div>
                    <div class="example-text">${parseText(ex,c)}</div>
                  </div>
                  <button class="btn-listen-sm" data-text="${plain(ex).replace(/"/g,'&quot;')}">▶ listen</button>
                </div>`).join('')}
            </div>
            <div class="audio-bar">
              <button class="btn-play-all" style="background:${c}" data-idx="${idx}">▶ play all</button>
              <button class="btn-stop">◼ stop</button>
              <div class="now-playing">
                <div class="wave">
                  <span style="background:${c}"></span><span style="background:${c}"></span>
                  <span style="background:${c}"></span><span style="background:${c}"></span>
                  <span style="background:${c}"></span>
                </div>
                <span></span>
              </div>
            </div>
          </div>
        </div>`;
    }
    track.appendChild(slide);
  });

  // Attach events
  track.querySelectorAll('.btn-listen-sm').forEach(btn=>{
    btn.addEventListener('click',function(e){e.stopPropagation();speakOne(this.dataset.text,this);});
  });
  track.querySelectorAll('.btn-play-all').forEach(btn=>{
    btn.addEventListener('click',function(e){e.stopPropagation();playSequence(CATS[current].items[parseInt(this.dataset.idx)]);});
  });
  track.querySelectorAll('.btn-stop').forEach(btn=>{
    btn.addEventListener('click',e=>{e.stopPropagation();stopAll();});
  });
  track.querySelectorAll('.btn-unlock').forEach(btn=>{
    btn.addEventListener('click',()=>alert('Payment coming soon!'));
  });
  track.querySelectorAll('.meaning-header').forEach(h=>{
    h.addEventListener('click',function(){
      const body=this.nextElementSibling;
      const icon=this.querySelector('.meaning-toggle-icon');
      const open=body.style.display!=='none';
      body.style.display=open?'none':'block';
      icon.textContent=open?'▸':'▾';
    });
  });

  updateUI();
  if(autoPlay&&cat.items[0]&&cardIndex<FREE_LIMIT) setTimeout(()=>playSequence(cat.items[0]),600);
}

function setTrackPos(animate){
  const track=document.getElementById('swipeTrack');
  const w=getW();
  track.style.transition=animate?'transform 0.32s cubic-bezier(0.25,0.46,0.45,0.94)':'none';
  track.style.transform=`translateX(${-(cardIndex*w)}px)`;
}

function updateUI(){
  const cat=CATS[current],total=cat.items.length;
  document.getElementById('progressIndicator').textContent=total?`${cardIndex+1} / ${total}`:'';
  document.getElementById('btnPrev').disabled=cardIndex===0;
  document.getElementById('btnNext').disabled=cardIndex>=total-1;
  document.getElementById('navRow').style.display=total?'flex':'none';
  document.getElementById('navDots').innerHTML=cat.items.map((_,i)=>{
    const locked=i>=FREE_LIMIT,active=i===cardIndex;
    return `<div class="dot${active?' active':''}${locked?' locked':''}" data-i="${i}"></div>`;
  }).join('');
  document.querySelectorAll('#navDots .dot:not(.locked)').forEach(d=>{
    d.addEventListener('click',()=>goTo(parseInt(d.dataset.i)));
  });
  Object.keys(CATS).forEach(k=>{
    const el=document.getElementById('cnt-'+k);
    if(el) el.textContent=CATS[k].items.length||'';
  });
}

function goTo(i){
  stopAll(); cardIndex=i; setTrackPos(true); updateUI();
  const item=CATS[current].items[i];
  if(autoPlay&&item&&i<FREE_LIMIT) setTimeout(()=>playSequence(item),400);
}
function prevCard(){if(cardIndex>0) goTo(cardIndex-1);}
function nextCard(){if(cardIndex<CATS[current].items.length-1) goTo(cardIndex+1);}

function switchCat(cat){
  stopAll(); current=cat; cardIndex=0;
  const data=CATS[cat];
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.bnav-item').forEach(el=>el.classList.remove('active'));
  document.getElementById('nav-'+cat)?.classList.add('active');
  document.getElementById('bnav-'+cat)?.classList.add('active');
  document.documentElement.style.setProperty('--active',data.color);
  document.getElementById('pageCat').textContent=data.title;
  document.getElementById('pageSub').textContent=data.sub;
  buildTrack();
}

function toggleTheme(){
  document.body.classList.toggle('light');
  const on=document.body.classList.contains('light');
  document.getElementById('themeToggle').classList.toggle('on',on);
  document.getElementById('themeBtn').textContent=on?'🌙 dark':'☀️ light';
}

function toggleAutoPlay(){
  autoPlay=!autoPlay;
  document.getElementById('autoPlayToggle').classList.toggle('on',autoPlay);
  document.getElementById('autoBtn').textContent=autoPlay?'⏸ auto':'▶ auto';
}

// Static bindings
['daily','mistakes','phrasal','advanced','idioms','shadowing','favorites','progress'].forEach(cat=>{
  document.getElementById('nav-'+cat)?.addEventListener('click',()=>switchCat(cat));
  document.getElementById('bnav-'+cat)?.addEventListener('click',()=>switchCat(cat));
});
document.getElementById('themeToggle').addEventListener('click',toggleTheme);
document.getElementById('themeBtn').addEventListener('click',toggleTheme);
document.getElementById('autoPlayToggle').addEventListener('click',toggleAutoPlay);
document.getElementById('autoBtn').addEventListener('click',toggleAutoPlay);
document.getElementById('btnPrev').addEventListener('click',prevCard);
document.getElementById('btnNext').addEventListener('click',nextCard);

// Keyboard
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight') nextCard();
  if(e.key==='ArrowLeft') prevCard();
  if(e.key===' '){e.preventDefault();isPlaying?stopAll():playSequence(CATS[current].items[cardIndex]);}
});

// Swipe
(function(){
  let startX=0,startY=0,isDragging=false,dragDelta=0,isHoriz=null,hasMoved=false;
  const THRESHOLD=44;
  function onStart(x,y){
    startX=x;startY=y;isDragging=true;dragDelta=0;isHoriz=null;hasMoved=false;
    document.getElementById('swipeTrack').style.transition='none';
  }
  function onMove(x,y){
    if(!isDragging) return;
    const dx=x-startX,dy=y-startY;
    if(isHoriz===null){
      if(Math.abs(dx)<6&&Math.abs(dy)<6) return;
      isHoriz=Math.abs(dx)>Math.abs(dy);
    }
    if(!isHoriz) return;
    hasMoved=true; dragDelta=dx;
    document.getElementById('swipeTrack').style.transform=`translateX(${-(cardIndex*getW())+dragDelta}px)`;
  }
  function onEnd(){
    if(!isDragging) return; isDragging=false;
    if(isHoriz&&hasMoved){
      if(dragDelta<-THRESHOLD) nextCard();
      else if(dragDelta>THRESHOLD) prevCard();
      else setTrackPos(true);
    }
    isHoriz=null; hasMoved=false;
  }
  const outer=document.getElementById('swipeOuter');
  outer.addEventListener('mousedown',e=>{e.preventDefault();onStart(e.clientX,e.clientY);});
  document.addEventListener('mousemove',e=>{if(isDragging)onMove(e.clientX,e.clientY);});
  document.addEventListener('mouseup',()=>onEnd());
  outer.addEventListener('touchstart',e=>{onStart(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
  document.addEventListener('touchmove',e=>{
    if(isDragging&&isHoriz===true) e.preventDefault();
    if(isDragging) onMove(e.touches[0].clientX,e.touches[0].clientY);
  },{passive:false});
  document.addEventListener('touchend',()=>onEnd());
})();

// Load Supabase
async function loadCards(){
  const {data,error}=await db.from('cards').select('*').order('id');
  if(error){console.error(error);buildTrack();return;}
  Object.keys(CATS).forEach(k=>CATS[k].items=[]);
  data.forEach(card=>{
    const cat=card.category;
    if(!CATS[cat]) return;
    const examples=Array.isArray(card.examples)?card.examples
      :(typeof card.examples==='string'?JSON.parse(card.examples):[]);
    CATS[cat].items.push({phrase:card.phrase,hero:card.hero,meaning:card.meaning,examples});
  });
  buildTrack();
}

(async () => {
  await loadUserRole();
  await loadCards();
  setTimeout(() => {
    rebuildSlideWidths();
    setTrackPos(false);
  }, 50);
})();
</script>
