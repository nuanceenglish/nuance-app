<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuance</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0a0a;
  --surface: #0f0f0f;
  --card: #141414;
  --border: #242424;
  --border-vis: #333;
  --text: #eeeeee;
  --text-muted: #777;
  --text-dim: #333;
  --active: #3DBA6F;
}

body {
  font-family: 'Outfit', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  transition: background 0.3s, color 0.3s;
}

body.light {
  --bg: #f5f0e8;
  --surface: #ede8dc;
  --card: #fff8f0;
  --border: #d4cfc3;
  --border-vis: #c0bab0;
  --text: #111;
  --text-muted: #888;
  --text-dim: #ccc;
}

body.light::before {
  content: '';
  position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none; z-index: 0;
}

.layout {
  display: grid;
  grid-template-columns: 210px 1fr;
  min-height: 100vh;
  position: relative; z-index: 1;
}

/* ── SIDEBAR ── */
.sidebar {
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 28px 0 24px;
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}

.brand {
  padding: 0 20px 22px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 14px;
}

.brand-name {
  font-size: 1rem;
  font-weight: 600;
  color: var(--text);
}

.brand-sub {
  font-size: 0.67rem;
  color: var(--text-muted);
  margin-top: 3px;
  font-weight: 300;
}

.nav-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 9px 20px;
  cursor: pointer;
  transition: all 0.12s;
  border-left: 2px solid transparent;
}

.nav-item:hover { background: rgba(255,255,255,0.03); }
body.light .nav-item:hover { background: rgba(0,0,0,0.03); }
.nav-item.active { border-left-color: var(--active); background: rgba(255,255,255,0.04); }
body.light .nav-item.active { background: rgba(0,0,0,0.04); }

.nav-text { font-size: 0.8rem; color: var(--text-muted); }
.nav-item.active .nav-text { color: var(--text); font-weight: 500; }
.nav-count { font-family: 'Space Mono', monospace; font-size: 0.55rem; color: var(--text-dim); }
.nav-divider { height: 1px; background: var(--border); margin: 10px 0; }

.sidebar-settings {
  padding: 14px 20px;
  border-top: 1px solid var(--border);
  margin-top: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.setting-label { font-size: 0.72rem; color: var(--text-muted); }

.toggle {
  width: 36px; height: 20px;
  background: var(--border-vis);
  border-radius: 10px;
  position: relative;
  cursor: pointer;
  transition: background 0.2s;
  flex-shrink: 0;
}
.toggle.on { background: var(--active); }
.toggle::after {
  content: '';
  position: absolute;
  width: 14px; height: 14px;
  background: #fff;
  border-radius: 50%;
  top: 3px; left: 3px;
  transition: transform 0.2s;
}
.toggle.on::after { transform: translateX(16px); }

/* ── MAIN ── */
.main { padding: 44px 56px 80px; max-width: 860px; }

.page-header {
  margin-bottom: 36px;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
}

.page-cat {
  font-family: 'Space Mono', monospace;
  font-size: 0.55rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--active);
  margin-bottom: 4px;
}
.page-sub { font-size: 0.82rem; color: var(--text-muted); font-weight: 300; }
.progress-indicator { font-family: 'Space Mono', monospace; font-size: 0.65rem; color: var(--text-muted); }

/* ── CARD SWIPE — FIX ── */
.swipe-container {
  position: relative;
  overflow: hidden;          /* clips slides that are off-screen */
  border-radius: 10px;
  cursor: grab;
  user-select: none;
  width: 100%;
}
.swipe-container:active { cursor: grabbing; }

.swipe-track {
  display: flex;
  width: 100%;
  /* transition set in JS; will-change helps GPU compositing */
  will-change: transform;
}

/* Each slide must be exactly as wide as the container — never more, never less */
.swipe-slide {
  flex: 0 0 100%;   /* shorthand: grow=0, shrink=0, basis=100% */
  width: 100%;      /* belt-and-suspenders for older browsers */
  min-width: 0;     /* prevent flex blowout */
}

/* ── CARD ── */
.card {
  background: var(--card);
  border: 1px solid var(--border-vis);
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 2px 20px rgba(0,0,0,0.3);
}

body.light .card { box-shadow: 0 2px 16px rgba(0,0,0,0.08); }

.card-top-bar { height: 4px; }
.card-body { padding: 32px 36px 28px; }

.hero-block { margin-bottom: 28px; }

.section-label {
  font-family: 'Space Mono', monospace;
  font-size: 0.52rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 10px;
}

.hero-sentence {
  font-size: 1.9rem;
  font-weight: 700;
  line-height: 1.35;
  color: var(--text);
  letter-spacing: -0.01em;
}

.hero-sentence .hl {
  color: #000;
  padding: 1px 6px;
  border-radius: 2px;
  display: inline;
}

.phrase-block {
  padding: 22px 0;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  margin-bottom: 24px;
}

.phrase-text {
  font-size: 1.8rem;
  font-weight: 700;
  line-height: 1.15;
  margin-bottom: 14px;
}

.meaning-header {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  margin-bottom: 0;
}

.meaning-toggle-icon { font-size: 0.65rem; color: var(--text-muted); transition: transform 0.2s; }
.meaning-toggle-icon.closed { transform: rotate(-90deg); }

.meaning-body { margin-top: 10px; }

.meaning-text {
  font-size: 1rem;
  line-height: 1.55;
  color: var(--text);
  font-weight: 300;
}

.examples-block {}

.example-item {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding: 16px 0;
  border-top: 1px solid var(--border);
}

.example-quote {
  font-size: 1.5rem;
  line-height: 1;
  margin-top: 2px;
  flex-shrink: 0;
  font-weight: 700;
  opacity: 0.4;
}

.example-text {
  font-size: 1rem;
  font-weight: 400;
  line-height: 1.55;
  color: var(--text);
}

.example-text .hl { font-weight: 600; }

.audio-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 20px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
  flex-wrap: wrap;
}

.btn-play {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 20px;
  background: var(--active);
  color: #000;
  border: none;
  border-radius: 4px;
  font-family: 'Space Mono', monospace;
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
  transition: opacity 0.15s;
}

.btn-play:hover { opacity: 0.85; }

.btn-stop {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 20px;
  background: transparent;
  color: var(--text-muted);
  border: 1px solid var(--border-vis);
  border-radius: 4px;
  font-family: 'Space Mono', monospace;
  font-size: 0.65rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.15s;
}

.btn-stop:hover { border-color: var(--text-muted); color: var(--text); }

.now-playing {
  font-family: 'Space Mono', monospace;
  font-size: 0.6rem;
  color: var(--active);
  letter-spacing: 0.08em;
  display: none;
  align-items: center;
  gap: 8px;
}
.now-playing.show { display: flex; }

.wave { display: flex; align-items: center; gap: 2px; height: 10px; }
.wave span {
  width: 2px; border-radius: 1px;
  animation: wv 0.7s ease-in-out infinite;
}
.wave span:nth-child(1) { height: 3px; animation-delay:0s; }
.wave span:nth-child(2) { height: 9px; animation-delay:0.1s; }
.wave span:nth-child(3) { height: 6px; animation-delay:0.2s; }
.wave span:nth-child(4) { height: 9px; animation-delay:0.15s; }
.wave span:nth-child(5) { height: 3px; animation-delay:0.05s; }
@keyframes wv { 0%,100%{transform:scaleY(0.4)} 50%{transform:scaleY(1)} }

.nav-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 24px;
}

.btn-nav {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 20px;
  background: transparent;
  border: 1px solid var(--border-vis);
  border-radius: 4px;
  font-family: 'Space Mono', monospace;
  font-size: 0.65rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.15s;
}

.btn-nav:hover:not(:disabled) { border-color: var(--active); color: var(--active); }
.btn-nav:disabled { opacity: 0.2; cursor: not-allowed; }

.nav-dots { display: flex; gap: 6px; align-items: center; }

.dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--border-vis);
  transition: background 0.2s, transform 0.2s;
  cursor: pointer;
}
.dot.active { background: var(--active); transform: scale(1.3); }

.empty { padding: 60px 0; color: var(--text-muted); font-size: 0.85rem; font-weight: 300; }
</style>
</head>
<body>
<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-name">Nuance</div>
      <div class="brand-sub">learn english, naturally.</div>
    </div>

    <div class="nav-item active" onclick="switchCat('daily')" id="nav-daily">
      <span class="nav-text">Daily Expressions</span>
      <span class="nav-count">200</span>
    </div>
    <div class="nav-item" onclick="switchCat('mistakes')" id="nav-mistakes">
      <span class="nav-text">Common Mistakes</span>
      <span class="nav-count">80</span>
    </div>
    <div class="nav-item" onclick="switchCat('phrasal')" id="nav-phrasal">
      <span class="nav-text">Phrasal Words</span>
      <span class="nav-count">120</span>
    </div>
    <div class="nav-item" onclick="switchCat('advanced')" id="nav-advanced">
      <span class="nav-text">Advanced Words</span>
      <span class="nav-count">150</span>
    </div>
    <div class="nav-item" onclick="switchCat('idioms')" id="nav-idioms">
      <span class="nav-text">Idioms</span>
      <span class="nav-count">100</span>
    </div>

    <div class="nav-divider"></div>

    <div class="nav-item" onclick="switchCat('shadowing')" id="nav-shadowing">
      <span class="nav-text">Shadowing</span>
    </div>
    <div class="nav-item" onclick="switchCat('favorites')" id="nav-favorites">
      <span class="nav-text">Favorites</span>
    </div>
    <div class="nav-item" onclick="switchCat('progress')" id="nav-progress">
      <span class="nav-text">Progress</span>
    </div>

    <div class="sidebar-settings">
      <div class="setting-row">
        <span class="setting-label">Light mode</span>
        <div class="toggle" id="themeToggle" onclick="toggleTheme()"></div>
      </div>
      <div class="setting-row">
        <span class="setting-label">Auto-play</span>
        <div class="toggle on" id="autoPlayToggle" onclick="toggleAutoPlay()"></div>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="page-header">
      <div>
        <div class="page-cat" id="pageCat">Daily Expressions</div>
        <div class="page-sub" id="pageSub">Natural expressions for real-life conversations.</div>
      </div>
      <div class="progress-indicator" id="progressIndicator"></div>
    </div>

    <div class="swipe-container" id="swipeContainer">
      <div class="swipe-track" id="swipeTrack"></div>
    </div>

    <div class="nav-row" id="navRow">
      <button class="btn-nav" id="btnPrev" onclick="prevCard()">← prev</button>
      <div class="nav-dots" id="navDots"></div>
      <button class="btn-nav" id="btnNext" onclick="nextCard()">next →</button>
    </div>
  </main>
</div>

<script>
const CATS = {
  daily: {
    title: 'Daily Expressions',
    sub: 'Natural expressions for real-life conversations.',
    color: '#3DBA6F',
    items: [
      {
        phrase: 'fair enough',
        hero: "You have your reasons — [fair enough], I won't push further.",
        meaning: 'Used to show you accept or agree with what someone has said.',
        examples: [
          "You don't want to go? [Fair enough], we can do it another time.",
          "I think we should leave early. — [Fair enough].",
        ]
      },
      {
        phrase: 'how do I put this',
        hero: "[How do I put this]... the argument works on paper but feels hollow.",
        meaning: 'Used when searching for the right words to say something sensitive or difficult.',
        examples: [
          "[How do I put this] — I don't think we're on the same page.",
          "I'm not comfortable with that plan. [How do I put this] without sounding harsh.",
        ]
      },
      {
        phrase: 'to be honest',
        hero: "[To be honest], I wasn't expecting it to work out this well.",
        meaning: 'Used to introduce a frank or personal opinion.',
        examples: [
          "[To be honest], I don't think that's the right approach.",
          "[To be honest with you], I had my doubts at first.",
        ]
      },
    ]
  },
  mistakes: {
    title: 'Common Mistakes',
    sub: 'Fix the errors that give you away.',
    color: '#FF5C3A',
    items: [
      {
        phrase: 'interested IN (not "to")',
        hero: "I am [interested in] learning languages — not 'interested to learn'.",
        meaning: 'In English we always say "interested IN" something. Never "interested to" something.',
        examples: [
          "She is [interested in] this job. ✓  (NOT: interested to this job ✗)",
          "They are [interested in] traveling together next year.",
        ]
      },
      {
        phrase: 'make vs do',
        hero: "Can you [make a decision] soon? Stop saying 'do a decision'.",
        meaning: '"Make" is used for creating or producing something. "Do" is for tasks and activities.',
        examples: [
          "I need to [make a plan] before the meeting. (NOT: do a plan)",
          "She always [does her best] — and that means a lot.",
        ]
      },
    ]
  },
  phrasal: {
    title: 'Phrasal Words',
    sub: 'Master phrases native speakers use every day.',
    color: '#F5C518',
    items: [
      {
        phrase: 'cut to the chase',
        hero: "Let's [cut to the chase] — did we get the job or not?",
        meaning: 'Stop wasting time and get straight to the important point.',
        examples: [
          "I could see she was nervous, so I just [cut to the chase] and asked directly.",
          "He tends to ramble, so I asked him to [cut to the chase].",
        ]
      },
      {
        phrase: 'get the hang of it',
        hero: "Don't worry, you'll [get the hang of it] after a few tries.",
        meaning: 'To learn how to do something; to become comfortable with a skill.',
        examples: [
          "It took me a week but I finally [got the hang of] driving on the left.",
          "Once you [get the hang of it], the software is actually quite intuitive.",
        ]
      },
      {
        phrase: 'bring it up',
        hero: "I didn't want to [bring it up] during dinner, but we really need to talk.",
        meaning: 'To mention or introduce a topic in conversation.',
        examples: [
          "She finally [brought it up] — the issue she'd been avoiding for weeks.",
          "Don't [bring it up] unless he asks — it'll only cause tension.",
        ]
      },
      {
        phrase: 'fall through',
        hero: "The deal [fell through] at the last minute — we were all disappointed.",
        meaning: 'When a plan or agreement fails to happen or be completed.',
        examples: [
          "Our trip to Barcelona [fell through] because of the strike.",
          "I was counting on that job offer, but it [fell through].",
        ]
      },
      {
        phrase: 'put off',
        hero: "She keeps [putting off] the conversation she knows she needs to have.",
        meaning: 'To delay doing something; to postpone.',
        examples: [
          "Stop [putting it off] — just send the email.",
          "He [put off] going to the doctor for months.",
        ]
      },
    ]
  },
  advanced: {
    title: 'Advanced Words',
    sub: 'Elevate your vocabulary with words native speakers actually use.',
    color: '#4A9EFF',
    items: [
      {
        phrase: 'nuance',
        hero: "There's a lot of [nuance] in the way he answered that question.",
        meaning: 'A subtle difference in meaning, expression, or sound.',
        examples: [
          "I love the [nuances] in this movie — every scene means something.",
          "Good writing captures the [nuance] of human emotion.",
        ]
      },
      {
        phrase: 'candid',
        hero: "I appreciate your [candid] feedback — most people just say what I want to hear.",
        meaning: 'Truthful and straightforward; not hiding your real thoughts.',
        examples: [
          "She was very [candid] about the challenges she faced.",
          "Can I be [candid] with you for a second?",
        ]
      },
      {
        phrase: 'compelling',
        hero: "His argument was so [compelling] that even his critics reconsidered.",
        meaning: 'Extremely interesting or convincing; impossible to ignore.',
        examples: [
          "That's a [compelling] reason to change the approach.",
          "She gave a [compelling] performance — the audience was silent.",
        ]
      },
    ]
  },
  idioms: {
    title: 'Idioms',
    sub: 'Expressions that mean more than the words themselves.',
    color: '#B47FFF',
    items: [
      {
        phrase: 'a piece of cake',
        hero: "That test was [a piece of cake] — I finished in twenty minutes.",
        meaning: 'Something that is very easy to do.',
        examples: [
          "Don't worry, the interview is [a piece of cake] if you prepare well.",
          "That task you gave me? [A piece of cake].",
        ]
      },
      {
        phrase: 'let it slide',
        hero: "The teacher [let that mistake slide] this time, but warned us not to repeat it.",
        meaning: 'To allow something wrong to happen without punishing or correcting it.',
        examples: [
          "I know I was late again, but my boss [let it slide].",
          "They can't keep [letting these problems slide] — it'll catch up with them.",
        ]
      },
      {
        phrase: 'on the fence',
        hero: "I'm still [on the fence] about whether to accept the offer.",
        meaning: 'Unable to decide between two options; undecided.',
        examples: [
          "She's been [on the fence] about moving abroad for months.",
          "The voters are [on the fence] — it could go either way.",
        ]
      },
    ]
  },
  shadowing: { title: 'Shadowing', sub: 'Coming soon.', color: '#555', items: [] },
  favorites: { title: 'Favorites', sub: 'Your saved phrases.', color: '#555', items: [] },
  progress: { title: 'Progress', sub: 'Your learning journey.', color: '#555', items: [] },
};

let current = 'daily';
let cardIndex = 0;
let autoPlay = true;
let isPlaying = false;
const synth = window.speechSynthesis;

function parseText(text, color) {
  return text.replace(/\[([^\]]+)\]/g,
    `<span class="hl" style="background:${color};color:#000;padding:1px 6px;border-radius:2px">$1</span>`);
}

function plain(text) { return text.replace(/\[([^\]]+)\]/g, '$1'); }

function stopAll() {
  synth.cancel();
  isPlaying = false;
  const btn = document.getElementById('btnPlay');
  const np = document.getElementById('nowPlaying');
  if (btn) btn.textContent = '▶ play all';
  if (np) np.classList.remove('show');
}

function playSequence(item) {
  stopAll();
  isPlaying = true;
  const btn = document.getElementById('btnPlay');
  const np = document.getElementById('nowPlaying');
  const npText = document.getElementById('npText');
  if (btn) btn.textContent = '▶ playing...';
  if (np) np.classList.add('show');

  const steps = [
    { text: plain(item.hero), label: 'sentence' },
    { text: item.phrase, label: 'phrase' },
    { text: item.meaning, label: 'meaning' },
    ...item.examples.map((e, i) => ({ text: plain(e), label: `example ${i+1}` })),
  ];

  let i = 0;
  function next() {
    if (!isPlaying || i >= steps.length) { stopAll(); return; }
    if (npText) npText.textContent = steps[i].label;
    const u = new SpeechSynthesisUtterance(steps[i].text);
    u.lang = 'en-GB'; u.rate = 0.85;
    u.onend = () => { i++; setTimeout(next, 600); };
    u.onerror = stopAll;
    synth.speak(u);
  }
  next();
}

function buildTrack() {
  const cat = CATS[current];
  const track = document.getElementById('swipeTrack');
  track.innerHTML = '';

  if (!cat.items.length) {
    track.innerHTML = `<div class="swipe-slide"><div class="empty">Coming soon.</div></div>`;
    return;
  }

  cat.items.forEach((item, idx) => {
    const slide = document.createElement('div');
    slide.className = 'swipe-slide';
    const c = cat.color;
    slide.innerHTML = `
      <div class="card">
        <div class="card-top-bar" style="background:${c}"></div>
        <div class="card-body">

          <div class="hero-block">
            <div class="section-label">example</div>
            <div class="hero-sentence">${parseText(item.hero, c)}</div>
          </div>

          <div class="phrase-block">
            <div class="section-label">phrase</div>
            <div class="phrase-text" style="color:${c}">${item.phrase}</div>
            <div class="meaning-header" onclick="toggleMeaning(this)">
              <span class="meaning-label">meaning</span>
              <span class="meaning-toggle-icon">▾</span>
            </div>
            <div class="meaning-body">
              <div class="meaning-text">${item.meaning}</div>
            </div>
          </div>

          <div class="examples-block">
            <div class="section-label">more examples</div>
            ${item.examples.map(ex => `
              <div class="example-item">
                <div class="example-quote" style="color:${c}">"</div>
                <div class="example-text">${parseText(ex, c)}</div>
              </div>
            `).join('')}
          </div>

          <div class="audio-bar">
            <button class="btn-play" id="btnPlay" style="background:${c}" onclick="playSequence(CATS['${current}'].items[${idx}])">▶ play all</button>
            <button class="btn-stop" onclick="stopAll()">◼ stop</button>
            <div class="now-playing" id="nowPlaying">
              <div class="wave">
                <span style="background:${c}"></span>
                <span style="background:${c}"></span>
                <span style="background:${c}"></span>
                <span style="background:${c}"></span>
                <span style="background:${c}"></span>
              </div>
              <span id="npText"></span>
            </div>
          </div>

        </div>
      </div>
    `;
    track.appendChild(slide);
  });

  updateTrackPosition(false);
}

function toggleMeaning(header) {
  const body = header.nextElementSibling;
  const icon = header.querySelector('.meaning-toggle-icon');
  const open = body.style.display !== 'none';
  body.style.display = open ? 'none' : 'block';
  icon.textContent = open ? '▸' : '▾';
}

function updateTrackPosition(animate = true) {
  const track = document.getElementById('swipeTrack');
  const container = document.getElementById('swipeContainer');

  // Use the container's actual pixel width so the offset is always exact
  const w = container.offsetWidth;

  if (!animate) {
    track.style.transition = 'none';
  } else {
    track.style.transition = 'transform 0.38s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
  }

  track.style.transform = `translateX(-${cardIndex * w}px)`;

  // Re-enable transitions after the instant jump
  if (!animate) {
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        track.style.transition = 'transform 0.38s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
      });
    });
  }
}

function updateUI() {
  const cat = CATS[current];
  const total = cat.items.length;
  document.getElementById('progressIndicator').textContent = total ? `${cardIndex + 1} / ${total}` : '';
  document.getElementById('btnPrev').disabled = cardIndex === 0;
  document.getElementById('btnNext').disabled = cardIndex >= total - 1;
  document.getElementById('navRow').style.display = total ? 'flex' : 'none';

  const dots = document.getElementById('navDots');
  dots.innerHTML = cat.items.map((_, i) =>
    `<div class="dot${i === cardIndex ? ' active' : ''}" onclick="goTo(${i})"></div>`
  ).join('');
}

function goTo(i) {
  stopAll();
  cardIndex = i;
  updateTrackPosition(true);
  updateUI();
  if (autoPlay && CATS[current].items[i]) setTimeout(() => playSequence(CATS[current].items[i]), 400);
}

function prevCard() { if (cardIndex > 0) goTo(cardIndex - 1); }
function nextCard() { if (cardIndex < CATS[current].items.length - 1) goTo(cardIndex + 1); }

function switchCat(cat) {
  stopAll();
  current = cat;
  cardIndex = 0;
  const data = CATS[cat];
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.getElementById('nav-' + cat)?.classList.add('active');
  document.documentElement.style.setProperty('--active', data.color);
  document.getElementById('pageCat').textContent = data.title;
  document.getElementById('pageSub').textContent = data.sub;
  buildTrack();
  updateUI();
  if (autoPlay && data.items[0]) setTimeout(() => playSequence(data.items[0]), 400);
}

function toggleTheme() {
  document.body.classList.toggle('light');
  document.getElementById('themeToggle').classList.toggle('on');
}

function toggleAutoPlay() {
  autoPlay = !autoPlay;
  document.getElementById('autoPlayToggle').classList.toggle('on', autoPlay);
}

// ── SWIPE / DRAG ──
(function () {
  let startX = 0, isDragging = false, dragDelta = 0;
  const THRESHOLD = 60; // px to commit a swipe

  function getTrack() { return document.getElementById('swipeTrack'); }
  function getW()     { return document.getElementById('swipeContainer').offsetWidth; }

  function onStart(x) {
    startX = x;
    isDragging = true;
    dragDelta = 0;
    getTrack().style.transition = 'none'; // disable during drag
  }

  function onMove(x) {
    if (!isDragging) return;
    dragDelta = x - startX;
    const base = -(cardIndex * getW());
    getTrack().style.transform = `translateX(${base + dragDelta}px)`;
  }

  function onEnd() {
    if (!isDragging) return;
    isDragging = false;

    if (dragDelta < -THRESHOLD) nextCard();
    else if (dragDelta > THRESHOLD) prevCard();
    else updateTrackPosition(true); // snap back
  }

  // Mouse
  document.addEventListener('mousedown', e => {
    if (e.target.closest('#swipeContainer')) { e.preventDefault(); onStart(e.clientX); }
  });
  document.addEventListener('mousemove', e => { if (isDragging) onMove(e.clientX); });
  document.addEventListener('mouseup',   () => onEnd());

  // Touch
  document.addEventListener('touchstart', e => {
    if (e.target.closest('#swipeContainer')) onStart(e.touches[0].clientX);
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (isDragging) onMove(e.touches[0].clientX);
  }, { passive: true });
  document.addEventListener('touchend', e => onEnd());

  // Resize: recalculate position without animation
  window.addEventListener('resize', () => updateTrackPosition(false));
})();

// ── KEYBOARD ──
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') nextCard();
  if (e.key === 'ArrowLeft')  prevCard();
  if (e.key === ' ') {
    e.preventDefault();
    isPlaying ? stopAll() : playSequence(CATS[current].items[cardIndex]);
  }
});

// Init
buildTrack();
updateUI();
if (autoPlay && CATS[current].items[0]) setTimeout(() => playSequence(CATS[current].items[0]), 600);
</script>
</body>
