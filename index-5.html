<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Nuance">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Nuance</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#0a0a0a;--surface:#0f0f0f;--card:#141414;
  --border:#242424;--bvis:#333;
  --text:#eee;--muted:#777;--dim:#333;
  --active:#3DBA6F;--navh:64px;
}

body{
  font-family:'Outfit',sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;overflow-x:hidden;
  transition:background .3s,color .3s;
}

body.light{
  --bg:#f5f0e8;--surface:#ede8dc;--card:#fdfaf5;
  --border:#d4cfc3;--bvis:#c0bab0;
  --text:#1a1209;--muted:#7a7060;--dim:#c0bab0;
}

/* ── DESKTOP ── */
.layout{display:grid;grid-template-columns:210px 1fr;min-height:100vh}

.sidebar{
  background:var(--surface);border-right:1px solid var(--border);
  padding:28px 0 24px;display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{padding:0 20px 20px;border-bottom:1px solid var(--border);margin-bottom:12px}
.brand-name{font-size:1.1rem;font-weight:700;color:var(--text)}
.brand-sub{font-size:.65rem;color:var(--muted);margin-top:3px;font-weight:300}

.nav-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:9px 20px;cursor:pointer;border-left:2px solid transparent;transition:all .12s;
}
.nav-item:hover{background:rgba(255,255,255,.03)}
body.light .nav-item:hover{background:rgba(0,0,0,.03)}
.nav-item.active{border-left-color:var(--active);background:rgba(255,255,255,.04)}
body.light .nav-item.active{background:rgba(0,0,0,.04)}
.nav-text{font-size:.8rem;color:var(--muted)}
.nav-item.active .nav-text{color:var(--text);font-weight:500}
.nav-count{font-family:'Space Mono',monospace;font-size:.55rem;color:var(--dim)}
.nav-div{height:1px;background:var(--border);margin:10px 0}

.sidebar-bottom{
  padding:14px 20px;border-top:1px solid var(--border);
  margin-top:auto;display:flex;flex-direction:column;gap:12px;
}
.srow{display:flex;align-items:center;justify-content:space-between}
.slabel{font-size:.72rem;color:var(--muted)}
.tog{width:36px;height:20px;background:var(--bvis);border-radius:10px;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0}
.tog.on{background:var(--active)}
.tog::after{content:'';position:absolute;width:14px;height:14px;background:#fff;border-radius:50%;top:3px;left:3px;transition:transform .2s}
.tog.on::after{transform:translateX(16px)}

/* ── TOPBAR (mobile only) ── */
.topbar{
  display:none;position:sticky;top:0;z-index:50;
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:10px 16px;align-items:center;justify-content:space-between;
}
.topbar-brand{font-size:1rem;font-weight:700;color:var(--text)}
.topbar-right{display:flex;gap:8px}
.topbar-btn{
  font-size:.62rem;font-family:'Space Mono',monospace;
  color:var(--muted);background:var(--card);
  border:1px solid var(--bvis);border-radius:4px;
  padding:7px 10px;cursor:pointer;min-height:34px;min-width:68px;text-align:center;
  -webkit-tap-highlight-color:transparent;
}

/* ── BOTTOM NAV (mobile only) ── */
.botnav{
  display:none;position:fixed;bottom:0;left:0;right:0;
  height:var(--navh);background:var(--surface);
  border-top:2px solid var(--border);z-index:100;
  overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.botnav::-webkit-scrollbar{display:none}
.botnav-inner{display:flex;height:100%;min-width:max-content}
.bni{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:5px;padding:0 16px;cursor:pointer;border-top:3px solid transparent;
  flex-shrink:0;-webkit-tap-highlight-color:transparent;
}
.bni.active{border-top-color:var(--active)}
.bni-dot{width:7px;height:7px;border-radius:50%;background:var(--bvis)}
.bni.active .bni-dot{background:var(--active)}
.bni-label{font-size:.65rem;color:var(--muted);white-space:nowrap}
.bni.active .bni-label{color:var(--text);font-weight:600}

/* ── MAIN ── */
.main{padding:40px 52px calc(80px);max-width:860px}

.phead{
  margin-bottom:28px;padding-bottom:14px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:flex-end;justify-content:space-between;
}
.pcat{font-family:'Space Mono',monospace;font-size:.55rem;letter-spacing:.22em;text-transform:uppercase;color:var(--active);margin-bottom:4px}
.psub{font-size:.82rem;color:var(--muted);font-weight:300}
.prog{font-family:'Space Mono',monospace;font-size:.65rem;color:var(--muted)}

/* ── SCROLL SNAP TRACK ── */
.track{
  display:flex;
  overflow-x:scroll;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  gap:0;
  border-radius:10px;
}
.track::-webkit-scrollbar{display:none}

.slide{
  flex:0 0 100%;
  width:100%;
  scroll-snap-align:start;
  scroll-snap-stop:always;
}

/* ── CARD ── */
.card{
  background:var(--card);border:1px solid var(--bvis);
  border-radius:10px;overflow:hidden;
  box-shadow:0 2px 20px rgba(0,0,0,.5);
}
body.light .card{box-shadow:0 1px 12px rgba(0,0,0,.08)}
.ctop{height:4px}
.cbody{padding:28px 32px 24px}

.slabel{font-family:'Space Mono',monospace;font-size:.52rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.hero-block{margin-bottom:22px}
.hero-s{font-size:1.75rem;font-weight:700;line-height:1.35;color:var(--text);letter-spacing:-.01em;margin-bottom:12px}
.hero-s .hl{color:#000;padding:1px 6px;border-radius:2px}

.lbtn{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 14px;border:1px solid var(--bvis);border-radius:4px;
  background:transparent;font-family:'Space Mono',monospace;font-size:.58rem;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muted);cursor:pointer;
  min-height:40px;-webkit-tap-highlight-color:transparent;transition:all .15s;
}
.lbtn.playing{border-color:var(--active);color:var(--active)}

.pblock{padding:16px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:18px}
.prow{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.ptxt{font-size:1.65rem;font-weight:700;line-height:1.15}

.mhead{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 0}
.mlabel{font-family:'Space Mono',monospace;font-size:.52rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.micon{font-size:.65rem;color:var(--muted)}
.mbody{margin-top:8px}
.mtxt{font-size:.95rem;line-height:1.6;color:var(--text);font-weight:300}

.eitem{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--border)}
.eleft{display:flex;align-items:flex-start;gap:8px;flex:1;min-width:0}
.equote{font-size:1.3rem;line-height:1;margin-top:2px;flex-shrink:0;font-weight:700;opacity:.3}
.etxt{font-size:.95rem;font-weight:400;line-height:1.55;color:var(--text)}
.etxt .hl{font-weight:600}

.abar{display:flex;align-items:center;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border);flex-wrap:wrap}
.playbtn{
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 18px;border:none;border-radius:4px;
  font-family:'Space Mono',monospace;font-size:.6rem;
  font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:#000;cursor:pointer;min-height:42px;-webkit-tap-highlight-color:transparent;
}
.stopbtn{
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 14px;background:transparent;color:var(--muted);
  border:1px solid var(--bvis);border-radius:4px;
  font-family:'Space Mono',monospace;font-size:.6rem;
  letter-spacing:.1em;text-transform:uppercase;cursor:pointer;min-height:42px;
}
.nowp{font-family:'Space Mono',monospace;font-size:.55rem;color:var(--active);display:none;align-items:center;gap:6px}
.nowp.show{display:flex}
.wave{display:flex;align-items:center;gap:2px;height:10px}
.wave span{width:2px;border-radius:1px;animation:wv .7s ease-in-out infinite}
.wave span:nth-child(1){height:3px;animation-delay:0s}
.wave span:nth-child(2){height:9px;animation-delay:.1s}
.wave span:nth-child(3){height:6px;animation-delay:.2s}
.wave span:nth-child(4){height:9px;animation-delay:.15s}
.wave span:nth-child(5){height:3px;animation-delay:.05s}
@keyframes wv{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}

/* LOCK */
.lcard{background:var(--card);border:1px solid var(--bvis);border-radius:10px;overflow:hidden;position:relative;box-shadow:0 2px 20px rgba(0,0,0,.5)}
body.light .lcard{box-shadow:0 1px 12px rgba(0,0,0,.08)}
.linner{padding:28px 32px;filter:blur(5px);pointer-events:none;user-select:none;opacity:.35}
.lover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(10,10,10,.82)}
body.light .lover{background:rgba(245,240,232,.82)}
.licon{font-size:2rem}
.ltitle{font-size:1rem;font-weight:600;color:var(--text)}
.lsub{font-size:.78rem;color:var(--muted);text-align:center;padding:0 20px}
.unlockbtn{padding:11px 22px;border:none;border-radius:4px;font-family:'Space Mono',monospace;font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#000;cursor:pointer;min-height:42px;margin-top:4px}

/* NAV ROW */
.navrow{display:flex;align-items:center;justify-content:space-between;margin-top:20px}
.navbtn{
  display:inline-flex;align-items:center;gap:8px;padding:10px 16px;
  background:transparent;border:1px solid var(--bvis);border-radius:4px;
  font-family:'Space Mono',monospace;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);cursor:pointer;min-height:42px;-webkit-tap-highlight-color:transparent;transition:all .15s;
}
.navbtn:active:not(:disabled){border-color:var(--active);color:var(--active)}
.navbtn:disabled{opacity:.2;cursor:not-allowed}
.dots{display:flex;gap:7px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--bvis);cursor:pointer;transition:background .2s,transform .2s}
.dot.active{background:var(--active);transform:scale(1.3)}
.dot.locked{opacity:.35;cursor:default}

.loading{padding:60px 20px;color:var(--muted);font-family:'Space Mono',monospace;font-size:.7rem;text-align:center}
.ldot{display:inline-block;animation:ld 1s ease-in-out infinite}
.ldot:nth-child(2){animation-delay:.2s}.ldot:nth-child(3){animation-delay:.4s}
@keyframes ld{0%,80%,100%{opacity:.2}40%{opacity:1}}

/* ── MOBILE ── */
@media(max-width:768px){
  .sidebar{display:none}
  .topbar{display:flex}
  .botnav{display:block}
  .layout{grid-template-columns:1fr}
  .main{padding:12px 12px calc(var(--navh) + 16px);max-width:100%}
  .phead{margin-bottom:14px;padding-bottom:10px}
  .psub{font-size:.72rem}
  .hero-s{font-size:1.25rem}
  .ptxt{font-size:1.3rem}
  .mtxt{font-size:.88rem}
  .etxt{font-size:.88rem}
  .cbody{padding:16px 14px 14px}
  .linner{padding:16px 14px}
}
@media(max-width:360px){
  .hero-s{font-size:1.1rem}
  .ptxt{font-size:1.15rem}
}
</style>
</head>
<body>

<div class="layout">

  <!-- TOPBAR mobile -->
  <div class="topbar">
    <div class="topbar-brand">Nuance</div>
    <div class="topbar-right">
      <button class="topbar-btn" id="themeBtn">☀️ light</button>
      <button class="topbar-btn" id="autoBtn">⏸ auto</button>
    </div>
  </div>

  <!-- SIDEBAR desktop -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-name">Nuance</div>
      <div class="brand-sub">learn english, naturally.</div>
    </div>
    <div class="nav-item active" id="nd-daily"><span class="nav-text">Daily Expressions</span><span class="nav-count" id="cnt-daily"></span></div>
    <div class="nav-item" id="nd-mistakes"><span class="nav-text">Common Mistakes</span><span class="nav-count" id="cnt-mistakes"></span></div>
    <div class="nav-item" id="nd-phrasal"><span class="nav-text">Phrasal Words</span><span class="nav-count" id="cnt-phrasal"></span></div>
    <div class="nav-item" id="nd-advanced"><span class="nav-text">Advanced Words</span><span class="nav-count" id="cnt-advanced"></span></div>
    <div class="nav-item" id="nd-idioms"><span class="nav-text">Idioms</span><span class="nav-count" id="cnt-idioms"></span></div>
    <div class="nav-div"></div>
    <div class="nav-item" id="nd-shadowing"><span class="nav-text">Shadowing</span></div>
    <div class="nav-item" id="nd-favorites"><span class="nav-text">Favorites</span></div>
    <div class="nav-item" id="nd-progress"><span class="nav-text">Progress</span></div>
    <div class="sidebar-bottom">
      <div class="srow"><span class="slabel">Light mode</span><div class="tog" id="themeToggle"></div></div>
      <div class="srow"><span class="slabel">Auto-play</span><div class="tog on" id="autoToggle"></div></div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="phead">
      <div>
        <div class="pcat" id="pageCat">Daily Expressions</div>
        <div class="psub" id="pageSub">Natural expressions for real-life conversations.</div>
      </div>
      <div class="prog" id="progEl"></div>
    </div>
    <div class="track" id="track">
      <div class="slide"><div class="loading"><span class="ldot">.</span><span class="ldot">.</span><span class="ldot">.</span></div></div>
    </div>
    <div class="navrow" id="navrow" style="display:none">
      <button class="navbtn" id="btnPrev">← prev</button>
      <div class="dots" id="dotsEl"></div>
      <button class="navbtn" id="btnNext">next →</button>
    </div>
  </main>
</div>

<!-- BOTTOM NAV mobile -->
<div class="botnav">
  <div class="botnav-inner">
    <div class="bni active" id="nb-daily"><div class="bni-dot"></div><span class="bni-label">Daily</span></div>
    <div class="bni" id="nb-mistakes"><div class="bni-dot"></div><span class="bni-label">Mistakes</span></div>
    <div class="bni" id="nb-phrasal"><div class="bni-dot"></div><span class="bni-label">Phrasal</span></div>
    <div class="bni" id="nb-advanced"><div class="bni-dot"></div><span class="bni-label">Advanced</span></div>
    <div class="bni" id="nb-idioms"><div class="bni-dot"></div><span class="bni-label">Idioms</span></div>
    <div class="bni" id="nb-shadowing"><div class="bni-dot"></div><span class="bni-label">Shadow</span></div>
    <div class="bni" id="nb-favorites"><div class="bni-dot"></div><span class="bni-label">Saved</span></div>
  </div>
</div>

<script>
const SB_URL='https://xlfgnhcltpqdtgmdjjwp.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhsZmduaGNsdHBxZHRnbWRqandwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4ODQ4ODMsImV4cCI6MjA5NDQ2MDg4M30.p8xggEvLrAAw5GuLsQu9XQLtreo715KJg1H6OEgKL2w';
const db=supabase.createClient(SB_URL,SB_KEY);

const FREE=3;
const CATS={
  daily:    {title:'Daily Expressions',sub:'Natural expressions for real-life conversations.',color:'#3DBA6F',items:[]},
  mistakes: {title:'Common Mistakes',sub:'Fix the errors that give you away.',color:'#FF5C3A',items:[]},
  phrasal:  {title:'Phrasal Words',sub:'Master phrases native speakers use every day.',color:'#F5C518',items:[]},
  advanced: {title:'Advanced Words',sub:'Elevate your vocabulary with words native speakers actually use.',color:'#4A9EFF',items:[]},
  idioms:   {title:'Idioms',sub:'Expressions that mean more than the words themselves.',color:'#B47FFF',items:[]},
  shadowing:{title:'Shadowing',sub:'Coming soon.',color:'#aaa',items:[]},
  favorites:{title:'Favorites',sub:'Your saved phrases.',color:'#aaa',items:[]},
  progress: {title:'Progress',sub:'Your learning journey.',color:'#aaa',items:[]},
};

let cur='daily',idx=0,autoPlay=true,playing=false;
const syn=window.speechSynthesis;

function px(t,c){return t.replace(/\[([^\]]+)\]/g,`<span class="hl" style="background:${c};color:#000;padding:1px 6px;border-radius:2px">$1</span>`)}
function pl(t){return t.replace(/\[([^\]]+)\]/g,'$1')}

function stopAll(){
  syn.cancel();playing=false;
  document.querySelectorAll('.playbtn').forEach(b=>b.textContent='▶ play all');
  document.querySelectorAll('.nowp').forEach(n=>n.classList.remove('show'));
  document.querySelectorAll('.lbtn').forEach(b=>b.classList.remove('playing'));
}

function speakOne(text,btn){
  syn.cancel();
  document.querySelectorAll('.lbtn').forEach(b=>b.classList.remove('playing'));
  document.querySelectorAll('.playbtn').forEach(b=>b.textContent='▶ play all');
  document.querySelectorAll('.nowp').forEach(n=>n.classList.remove('show'));
  playing=true;
  if(btn) btn.classList.add('playing');
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-GB';u.rate=0.85;
  u.onend=u.onerror=()=>{playing=false;if(btn)btn.classList.remove('playing')};
  syn.speak(u);
}

function playSeq(item){
  stopAll();playing=true;
  const pb=document.querySelector('.playbtn');
  const np=document.querySelector('.nowp');
  const ns=np?.querySelector('span:last-child');
  if(pb) pb.textContent='▶ playing...';
  if(np) np.classList.add('show');
  const steps=[
    {text:pl(item.hero),label:'sentence'},
    {text:item.phrase,label:'phrase'},
    {text:item.meaning,label:'meaning'},
    ...item.examples.map((e,i)=>({text:pl(e),label:`example ${i+1}`})),
  ];
  let i=0;
  function next(){
    if(!playing||i>=steps.length){stopAll();return}
    if(ns) ns.textContent=steps[i].label;
    const u=new SpeechSynthesisUtterance(steps[i].text);
    u.lang='en-GB';u.rate=0.85;
    u.onend=()=>{i++;setTimeout(next,600)};
    u.onerror=stopAll;
    syn.speak(u);
  }
  next();
}

function buildTrack(){
  const cat=CATS[cur];
  const track=document.getElementById('track');
  track.innerHTML='';
  idx=0;

  if(!cat.items.length){
    track.innerHTML=`<div class="slide"><div style="padding:60px 20px;color:var(--muted);font-size:.9rem;text-align:center">Coming soon.</div></div>`;
    updateUI();return;
  }

  cat.items.forEach((item,i)=>{
    const slide=document.createElement('div');
    slide.className='slide';
    const c=cat.color;
    const locked=i>=FREE;

    if(locked){
      slide.innerHTML=`
        <div class="lcard">
          <div class="ctop" style="background:${c}"></div>
          <div class="linner">
            <div style="font-size:1.2rem;font-weight:700;line-height:1.4;margin-bottom:10px">${px(item.hero,c)}</div>
            <div style="font-size:1.2rem;font-weight:700;color:${c}">${item.phrase}</div>
            <div style="margin-top:8px;font-size:.85rem;opacity:.6">${item.meaning}</div>
          </div>
          <div class="lover">
            <div class="licon">🔒</div>
            <div class="ltitle">Unlock Full Access</div>
            <div class="lsub">Get all ${cat.items.length} expressions in this pack</div>
            <button class="unlockbtn" style="background:${c}">Unlock Pack →</button>
          </div>
        </div>`;
    } else {
      slide.innerHTML=`
        <div class="card">
          <div class="ctop" style="background:${c}"></div>
          <div class="cbody">
            <div class="hero-block">
              <div class="slabel">example</div>
              <div class="hero-s">${px(item.hero,c)}</div>
              <button class="lbtn" data-text="${pl(item.hero).replace(/"/g,'&quot;')}">▶ listen</button>
            </div>
            <div class="pblock">
              <div class="slabel">phrase</div>
              <div class="prow">
                <div class="ptxt" style="color:${c}">${item.phrase}</div>
                <button class="lbtn" data-text="${item.phrase.replace(/"/g,'&quot;')}">▶ listen</button>
              </div>
              <div class="mhead">
                <span class="mlabel">meaning</span>
                <span class="micon">▾</span>
              </div>
              <div class="mbody"><div class="mtxt">${item.meaning}</div></div>
            </div>
            <div>
              <div class="slabel">more examples</div>
              ${item.examples.map(ex=>`
                <div class="eitem">
                  <div class="eleft">
                    <div class="equote" style="color:${c}">"</div>
                    <div class="etxt">${px(ex,c)}</div>
                  </div>
                  <button class="lbtn" data-text="${pl(ex).replace(/"/g,'&quot;')}">▶ listen</button>
                </div>`).join('')}
            </div>
            <div class="abar">
              <button class="playbtn" style="background:${c}" data-idx="${i}">▶ play all</button>
              <button class="stopbtn">◼ stop</button>
              <div class="nowp">
                <div class="wave">
                  <span style="background:${c}"></span><span style="background:${c}"></span>
                  <span style="background:${c}"></span><span style="background:${c}"></span>
                  <span style="background:${c}"></span>
                </div>
                <span></span>
              </div>
            </div>
          </div>
        </div>`;
    }
    track.appendChild(slide);
  });

  // Events
  track.querySelectorAll('.lbtn').forEach(b=>{
    b.addEventListener('click',function(e){e.stopPropagation();speakOne(this.dataset.text,this)});
  });
  track.querySelectorAll('.playbtn').forEach(b=>{
    b.addEventListener('click',function(e){e.stopPropagation();playSeq(CATS[cur].items[+this.dataset.idx])});
  });
  track.querySelectorAll('.stopbtn').forEach(b=>{
    b.addEventListener('click',e=>{e.stopPropagation();stopAll()});
  });
  track.querySelectorAll('.unlockbtn').forEach(b=>{
    b.addEventListener('click',()=>alert('Payment coming soon!'));
  });
  track.querySelectorAll('.mhead').forEach(h=>{
    h.addEventListener('click',function(){
      const body=this.nextElementSibling;
      const icon=this.querySelector('.micon');
      const open=body.style.display!=='none';
      body.style.display=open?'none':'block';
      icon.textContent=open?'▸':'▾';
    });
  });

  // Scroll snap — detect card change
  track.addEventListener('scroll',()=>{
    const newIdx=Math.round(track.scrollLeft/track.clientWidth);
    if(newIdx!==idx){
      idx=newIdx;
      updateUI();
      const item=CATS[cur].items[idx];
      if(autoPlay&&item&&idx<FREE) setTimeout(()=>playSeq(item),300);
    }
  },{passive:true});

  updateUI();
  if(autoPlay&&cat.items[0]) setTimeout(()=>playSeq(cat.items[0]),600);
}

function scrollTo(i){
  const track=document.getElementById('track');
  track.scrollTo({left:i*track.clientWidth,behavior:'smooth'});
}

function updateUI(){
  const cat=CATS[cur];const total=cat.items.length;
  document.getElementById('progEl').textContent=total?`${idx+1} / ${total}`:'';
  document.getElementById('btnPrev').disabled=idx===0;
  document.getElementById('btnNext').disabled=idx>=total-1;
  document.getElementById('navrow').style.display=total?'flex':'none';
  document.getElementById('dotsEl').innerHTML=cat.items.map((_,i)=>{
    const locked=i>=FREE,active=i===idx;
    return `<div class="dot${active?' active':''}${locked?' locked':''}" data-i="${i}"></div>`;
  }).join('');
  document.querySelectorAll('#dotsEl .dot:not(.locked)').forEach(d=>{
    d.addEventListener('click',()=>scrollTo(+d.dataset.i));
  });
  Object.keys(CATS).forEach(k=>{
    const el=document.getElementById('cnt-'+k);
    if(el) el.textContent=CATS[k].items.length||'';
  });
}

function switchCat(cat){
  stopAll();cur=cat;idx=0;
  const data=CATS[cat];
  document.querySelectorAll('.nav-item').forEach(e=>e.classList.remove('active'));
  document.querySelectorAll('.bni').forEach(e=>e.classList.remove('active'));
  document.getElementById('nd-'+cat)?.classList.add('active');
  document.getElementById('nb-'+cat)?.classList.add('active');
  document.documentElement.style.setProperty('--active',data.color);
  document.getElementById('pageCat').textContent=data.title;
  document.getElementById('pageSub').textContent=data.sub;
  buildTrack();
}

function toggleTheme(){
  document.body.classList.toggle('light');
  const on=document.body.classList.contains('light');
  document.getElementById('themeToggle').classList.toggle('on',on);
  document.getElementById('themeBtn').textContent=on?'🌙 dark':'☀️ light';
}

function toggleAuto(){
  autoPlay=!autoPlay;
  document.getElementById('autoToggle').classList.toggle('on',autoPlay);
  document.getElementById('autoBtn').textContent=autoPlay?'⏸ auto':'▶ auto';
}

// Bindings
['daily','mistakes','phrasal','advanced','idioms','shadowing','favorites','progress'].forEach(c=>{
  document.getElementById('nd-'+c)?.addEventListener('click',()=>switchCat(c));
  document.getElementById('nb-'+c)?.addEventListener('click',()=>switchCat(c));
});
document.getElementById('themeToggle').addEventListener('click',toggleTheme);
document.getElementById('themeBtn').addEventListener('click',toggleTheme);
document.getElementById('autoToggle').addEventListener('click',toggleAuto);
document.getElementById('autoBtn').addEventListener('click',toggleAuto);
document.getElementById('btnPrev').addEventListener('click',()=>{if(idx>0)scrollTo(idx-1)});
document.getElementById('btnNext').addEventListener('click',()=>{if(idx<CATS[cur].items.length-1)scrollTo(idx+1)});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'&&idx<CATS[cur].items.length-1)scrollTo(idx+1);
  if(e.key==='ArrowLeft'&&idx>0)scrollTo(idx-1);
  if(e.key===' '){e.preventDefault();playing?stopAll():playSeq(CATS[cur].items[idx])}
});

async function loadCards(){
  const {data,error}=await db.from('cards').select('*').order('id');
  if(error){console.error(error);buildTrack();return}
  Object.keys(CATS).forEach(k=>CATS[k].items=[]);
  data.forEach(card=>{
    const cat=card.category;
    if(!CATS[cat]) return;
    const ex=Array.isArray(card.examples)?card.examples
      :(typeof card.examples==='string'?JSON.parse(card.examples):[]);
    CATS[cat].items.push({phrase:card.phrase,hero:card.hero,meaning:card.meaning,examples:ex});
  });
  buildTrack();
}

loadCards();
</script>
</body>
</html>
